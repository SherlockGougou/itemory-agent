# Itemory Private Cloud for Synology DSM 7.2+
# Container Manager -> Project -> Create -> paste this file.
# Create the data folder (docker/itemory-agent) with File Station first.
# Guide: https://github.com/SherlockGougou/itemory-agent/blob/main/docs/installation.md
#
# Deleting photos is OFF by default. Two things must both change before the agent
# can remove a file: this photo volume must be mounted writable (drop the ":ro"
# suffix on the line below), and deleteMode must be set to "trash" or "permanent".
# Deleting is irreversible; "trash" only moves the file to <library>/.itemory-trash.
# See docs/configuration.md#deleting-photos. Keep ":ro" if you don't need it.
services:
  itemory-agent:
    image: ccr.ccs.tencentyun.com/itemory/itemory-agent:1
    container_name: itemory-agent
    restart: unless-stopped
    user: "1000:1000"                    # uid:gid that can read photos and write /data
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /volume1:/volumes/volume1:ro             # photos, read-only; drop ":ro" to allow deleting
      - /volume1/docker/itemory-agent:/data      # index, settings, pairing, thumbnails
    ports:
      - "8787:8787"                      # change only the first number if 8787 is taken
    environment:
      ITEMORY_PRESET: "balanced"         # light | balanced | performance (first start only)
      TZ: "Asia/Shanghai"                # your time zone, e.g. Europe/Berlin
    # Memory must fit the largest single video in your library, not the file count:
    # extracting a frame from a 2 GB video needs more than 512m. Too little memory
    # makes thumbnails silently fail. See docs/configuration.md#memory-limit
    mem_limit: 2g
