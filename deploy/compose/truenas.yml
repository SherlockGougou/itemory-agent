# Itemory Private Cloud for TrueNAS SCALE 24.10+ (amd64 only)
# Apps -> Discover Apps -> Custom App -> install from YAML -> paste this file.
# TrueNAS uses ACLs: if folders are unreadable, adjust `user` or the dataset ACL.
# Guide: https://github.com/SherlockGougou/itemory-agent/blob/main/docs/installation.md
services:
  itemory-agent:
    image: ghcr.io/sherlockgougou/itemory-agent:1
    container_name: itemory-agent
    restart: unless-stopped
    user: "1000:1000"                    # uid:gid that can read photos and write /data
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /mnt:/volumes/mnt:ro                     # photos, read-only; pick folders in the app
      - /mnt/apps/itemory-agent:/data            # index, settings, pairing, thumbnails
    ports:
      - "8787:8787"                      # change only the first number if 8787 is taken
    environment:
      ITEMORY_PRESET: "balanced"         # light | balanced | performance (first start only)
      TZ: "Asia/Shanghai"                # your time zone, e.g. Europe/Berlin
    cpus: "1.5"                          # speed only; raise it temporarily for the first scan
    # Memory must fit the largest single video in your library, not the file count:
    # extracting a frame from a 2 GB video needs more than 512m. Too little memory
    # makes thumbnails silently fail. See docs/configuration.md#memory-limit
    mem_limit: 2g
