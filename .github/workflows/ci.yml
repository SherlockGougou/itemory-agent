name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/api/web/package-lock.json

      # web.go 用 //go:embed all:web/out 嵌入控制台，out/ 不进版本库，
      # 必须先构建前端，否则 internal/api 包无法编译
      - name: Build dashboard
        run: make web

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o dist/itemory-agent ./cmd/itemory-agent
