name: tcr-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已有 GHCR 版本，例如 0.5.0"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: tcr-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install publishing tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Login to Tencent Cloud
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Mirror and verify both architectures anonymously
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TCR_REPOSITORY: ${{ vars.TCR_REPOSITORY || 'ccr.ccs.tencentyun.com/itemory/itemory-agent' }}
          REGISTRY_AUTH_FILE: /home/runner/.docker/config.json
        run: python3 scripts/publish_tcr_images.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcr-verification
          path: .agent-temp/tcr-release/tcr-verification.json
